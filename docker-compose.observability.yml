# Local observability (section 4.3): Prometheus with the SLO rules and Grafana with the
# MineSense dashboard, on top of the main docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (anonymous viewer)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: minesense_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infrastructure/observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: minesense_grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-minesense-local}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/minesense-slo.json
    volumes:
      - ./infrastructure/observability/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
