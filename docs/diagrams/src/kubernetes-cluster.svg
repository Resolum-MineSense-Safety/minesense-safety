<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1b2631; }
      .h { font-size: 17px; font-weight: 700; fill: #1b2631; }
      .t { font-size: 14px; fill: #263238; }
      .s { font-size: 12.5px; fill: #455a64; }
      .lbl { font-size: 12.5px; fill: #37474f; font-style: italic; }
      .flow { stroke: #37474f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #37474f; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="40" y="46" class="title">MineSense Safety: despliegue dentro del clúster Amazon EKS (Staging)</text>
  <text x="40" y="72" class="s">Un namespace por entorno con Pod Security "restricted", default-deny de red, cuotas y RBAC. Production repite el mismo esquema con 2-6 réplicas por servicio.</text>

  <!-- Internet / ALB -->
  <rect x="40" y="110" width="230" height="86" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="155" y="142" text-anchor="middle" class="h">Supervisores / Edge</text>
  <text x="155" y="164" text-anchor="middle" class="t">HTTPS (ACM, TLS 1.2+)</text>
  <text x="155" y="182" text-anchor="middle" class="s">AWS WAF opcional</text>
  <rect x="40" y="236" width="230" height="86" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="155" y="268" text-anchor="middle" class="h">Application Load Balancer</text>
  <text x="155" y="290" text-anchor="middle" class="t">Ingress minesense-api</text>
  <text x="155" y="308" text-anchor="middle" class="s">target-type ip: /api/v1/* y /*</text>
  <path d="M155 196 L155 232" class="flow"/>

  <!-- Cluster -->
  <rect x="310" y="100" width="1250" height="760" rx="14" fill="#fafafa" stroke="#90a4ae" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="330" y="128" class="h">Clúster EKS (nodos t3 en subredes privadas, 2 zonas de disponibilidad)</text>

  <!-- namespace staging -->
  <rect x="330" y="145" width="860" height="560" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="350" y="172" class="h">namespace: staging</text>
  <text x="350" y="192" class="s">PSA restricted · ResourceQuota 6 CPU / 12 Gi · LimitRange · NetworkPolicy default-deny-all · RoleBindings deployers / oncall / developers</text>
  <path d="M270 279 L346 279" class="flow"/>

  <!-- service grid -->
  <g font-size="13">
    <rect x="350" y="210" width="820" height="60" rx="8" fill="#ffffff" stroke="#bdbdbd"/>
    <text x="365" y="234" class="t" font-weight="700">Por microservicio (chart minesense-service): Deployment, Service, ConfigMap, ServiceAccount, HPA, NetworkPolicy, ServiceMonitor</text>
    <text x="365" y="256" class="s">RollingUpdate 0/1 · sondas startup, liveness y readiness · 100m CPU / 192Mi (límite 384Mi) · no root, FS de solo lectura</text>
  </g>
  <g>
    <rect x="350" y="290" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="447" y="316" text-anchor="middle" class="t">identity-access</text><text x="447" y="336" text-anchor="middle" class="s">HPA 1-3 · RDS</text>
    <rect x="558" y="290" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="655" y="316" text-anchor="middle" class="t">operations</text><text x="655" y="336" text-anchor="middle" class="s">HPA 1-3 · RDS</text>
    <rect x="766" y="290" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="863" y="316" text-anchor="middle" class="t">device-management</text><text x="863" y="336" text-anchor="middle" class="s">HPA 1-3 · RDS</text>
    <rect x="974" y="290" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="1071" y="316" text-anchor="middle" class="t">monitoring</text><text x="1071" y="336" text-anchor="middle" class="s">HPA 1-3 · RDS</text>

    <rect x="350" y="366" width="195" height="62" rx="8" fill="#ffebee" stroke="#e53935"/><text x="447" y="392" text-anchor="middle" class="t">fatigue-detection</text><text x="447" y="412" text-anchor="middle" class="s">HPA 1-3 · camino crítico</text>
    <rect x="558" y="366" width="195" height="62" rx="8" fill="#ffebee" stroke="#e53935"/><text x="655" y="392" text-anchor="middle" class="t">alert-service</text><text x="655" y="412" text-anchor="middle" class="s">HPA 1-3 · camino crítico</text>
    <rect x="766" y="366" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="863" y="392" text-anchor="middle" class="t">fleet-monitoring</text><text x="863" y="412" text-anchor="middle" class="s">HPA 1-3 · DocumentDB</text>
    <rect x="974" y="366" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="1071" y="392" text-anchor="middle" class="t">incident-management</text><text x="1071" y="412" text-anchor="middle" class="s">HPA 1-3 · DocumentDB</text>

    <rect x="350" y="442" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="447" y="468" text-anchor="middle" class="t">privacy-audit</text><text x="447" y="488" text-anchor="middle" class="s">HPA 1-3 · DocumentDB</text>
    <rect x="558" y="442" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="655" y="468" text-anchor="middle" class="t">reporting</text><text x="655" y="488" text-anchor="middle" class="s">IRSA → SQS / S3</text>
    <rect x="766" y="442" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="863" y="468" text-anchor="middle" class="t">analytics</text><text x="863" y="488" text-anchor="middle" class="s">HPA 1-3 · DocumentDB</text>
    <rect x="974" y="442" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="1071" y="468" text-anchor="middle" class="t">feedback-reliability</text><text x="1071" y="488" text-anchor="middle" class="s">HPA 1-3 · DocumentDB</text>

    <rect x="350" y="518" width="195" height="62" rx="8" fill="#e1f5fe" stroke="#0288d1"/><text x="447" y="544" text-anchor="middle" class="t">edge-synchronization</text><text x="447" y="564" text-anchor="middle" class="s">HPA 1-3 · DocumentDB</text>
    <rect x="558" y="518" width="195" height="62" rx="8" fill="#f3e5f5" stroke="#8e24aa"/><text x="655" y="544" text-anchor="middle" class="t">supervision-dashboard</text><text x="655" y="564" text-anchor="middle" class="s">nginx 8080 · CSP</text>
    <rect x="766" y="518" width="195" height="62" rx="8" fill="#fff3e0" stroke="#fb8c00"/><text x="863" y="544" text-anchor="middle" class="t">edge-agent (simulador)</text><text x="863" y="564" text-anchor="middle" class="s">Recreate · solo egress</text>
    <rect x="974" y="518" width="195" height="62" rx="8" fill="#eceff1" stroke="#546e7a"/><text x="1071" y="544" text-anchor="middle" class="t">Secrets / ConfigMaps</text><text x="1071" y="564" text-anchor="middle" class="s">desde Secrets Manager</text>
  </g>
  <text x="350" y="610" class="t" font-weight="700">Tráfico permitido por NetworkPolicy</text>
  <text x="350" y="632" class="s">Ingreso: pods part-of=minesense-safety y VPC (ALB, 10.20.0.0/16) al puerto 8080 · desde namespace monitoring (scraping de /metrics)</text>
  <text x="350" y="652" class="s">Salida: DNS de kube-system · otros pods MineSense:8080 · 443 (AWS APIs), 5432 (RDS), 27017 (DocumentDB), 9098 (MSK IAM)</text>
  <text x="350" y="684" class="lbl">HPA: escala al 70 % de CPU (sube 2 pods cada 30 s, baja 1 por minuto tras 5 min estables)</text>

  <!-- monitoring / argocd / kube-system -->
  <rect x="1210" y="145" width="330" height="175" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="1230" y="172" class="h">namespace: monitoring</text>
  <text x="1230" y="196" class="t">kube-prometheus-stack</text>
  <text x="1230" y="218" class="s">Prometheus (reglas SLO) · Alertmanager</text>
  <text x="1230" y="238" class="s">Grafana (dashboard MineSense SLOs)</text>
  <text x="1230" y="258" class="s">kube-state-metrics · node-exporter</text>
  <text x="1230" y="286" class="lbl">raspa ServiceMonitor cada 30 s</text>
  <path d="M1206 270 L1174 290" class="dash"/>

  <rect x="1210" y="340" width="330" height="140" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="1230" y="367" class="h">namespace: argocd</text>
  <text x="1230" y="391" class="t">Argo CD (GitOps)</text>
  <text x="1230" y="413" class="s">AppProject minesense-safety</text>
  <text x="1230" y="433" class="s">ApplicationSet: 14 apps + gateway + edge</text>
  <text x="1230" y="453" class="s">Staging auto-sync · Production manual</text>
  <path d="M1206 410 L1174 410" class="flow"/>

  <rect x="1210" y="500" width="330" height="205" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="1230" y="527" class="h">namespace: kube-system</text>
  <text x="1230" y="551" class="s">AWS Load Balancer Controller (IRSA)</text>
  <text x="1230" y="571" class="s">VPC CNI + agente de NetworkPolicy</text>
  <text x="1230" y="591" class="s">CoreDNS · kube-proxy · metrics-server (HPA)</text>
  <text x="1230" y="611" class="s">amazon-cloudwatch-observability</text>
  <text x="1230" y="631" class="s">   (Fluent Bit + Container Insights)</text>
  <text x="1230" y="651" class="s">EKS Pod Identity agent</text>

  <!-- data services -->
  <rect x="330" y="725" width="1210" height="120" rx="12" fill="#ffffff" stroke="#78909c" stroke-width="2"/>
  <text x="350" y="752" class="h">Servicios administrados de AWS (fuera del clúster, misma VPC)</text>
  <rect x="350" y="768" width="180" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5"/><text x="440" y="794" text-anchor="middle" class="t">RDS PostgreSQL</text><text x="440" y="813" text-anchor="middle" class="s">4 bases, cifrada</text>
  <rect x="545" y="768" width="180" height="60" rx="8" fill="#e8f5e9" stroke="#43a047"/><text x="635" y="794" text-anchor="middle" class="t">DocumentDB</text><text x="635" y="813" text-anchor="middle" class="s">9 bases, TLS</text>
  <rect x="740" y="768" width="180" height="60" rx="8" fill="#fff3e0" stroke="#fb8c00"/><text x="830" y="794" text-anchor="middle" class="t">MSK Serverless</text><text x="830" y="813" text-anchor="middle" class="s">eventos, IAM 9098</text>
  <rect x="935" y="768" width="180" height="60" rx="8" fill="#f3e5f5" stroke="#8e24aa"/><text x="1025" y="794" text-anchor="middle" class="t">SQS → Lambda → S3</text><text x="1025" y="813" text-anchor="middle" class="s">reportes PDF</text>
  <rect x="1130" y="768" width="190" height="60" rx="8" fill="#eceff1" stroke="#546e7a"/><text x="1225" y="794" text-anchor="middle" class="t">Secrets Manager</text><text x="1225" y="813" text-anchor="middle" class="s">cadenas de conexión</text>
  <rect x="1335" y="768" width="190" height="60" rx="8" fill="#e0f7fa" stroke="#00acc1"/><text x="1430" y="794" text-anchor="middle" class="t">CloudWatch Logs</text><text x="1430" y="813" text-anchor="middle" class="s">logs centralizados</text>
  <path d="M760 705 L760 764" class="flow"/>

  <!-- GHCR -->
  <rect x="40" y="380" width="230" height="110" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="155" y="412" text-anchor="middle" class="h">GHCR</text>
  <text x="155" y="434" text-anchor="middle" class="t">imágenes sha-&lt;commit&gt;</text>
  <text x="155" y="454" text-anchor="middle" class="s">escaneadas con Trivy</text>
  <text x="155" y="474" text-anchor="middle" class="s">Secret ghcr-pull</text>
  <path d="M270 435 L346 435" class="dash"/>
  <rect x="40" y="530" width="230" height="110" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
  <text x="155" y="562" text-anchor="middle" class="h">GitHub</text>
  <text x="155" y="584" text-anchor="middle" class="t">charts + release.yaml</text>
  <text x="155" y="604" text-anchor="middle" class="s">Argo CD (namespace argocd)</text>
  <text x="155" y="624" text-anchor="middle" class="s">lee el estado deseado (pull)</text>

  <text x="40" y="900" class="h">Leyenda</text>
  <rect x="40" y="915" width="22" height="16" fill="#ffebee" stroke="#e53935"/><text x="72" y="928" class="s">Camino crítico (SLO-2: P95 ≤ 500 ms)</text>
  <rect x="360" y="915" width="22" height="16" fill="#e1f5fe" stroke="#0288d1"/><text x="392" y="928" class="s">Microservicio .NET 8 (chart minesense-service)</text>
  <line x1="740" y1="923" x2="790" y2="923" class="flow"/><text x="800" y="928" class="s">Tráfico de datos</text>
  <line x1="960" y1="923" x2="1010" y2="923" class="dash"/><text x="1020" y="928" class="s">Control (imágenes, Git, métricas)</text>
  <text x="40" y="970" class="s">Fuente: infrastructure/helm, infrastructure/k8s, infrastructure/gitops, infrastructure/observability y terraform/modules/eks del repositorio minesense-safety.</text>
</svg>
