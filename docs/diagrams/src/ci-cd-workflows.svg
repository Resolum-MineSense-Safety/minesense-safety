<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1b2631; }
      .h { font-size: 16px; font-weight: 700; fill: #1b2631; }
      .t { font-size: 13.5px; fill: #263238; }
      .s { font-size: 12.5px; fill: #455a64; }
      .k { font-size: 12px; fill: #ffffff; font-weight: 700; }
      .lbl { font-size: 12.5px; fill: #37474f; font-style: italic; }
      .flow { stroke: #37474f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="40" y="46" class="title">Pipelines CI/CD de MineSense Safety en GitHub Actions</text>
  <text x="40" y="72" class="s">Workflows por disparador, checks obligatorios de las reglas de rama y métricas de 361 ejecuciones (05/10/2026 – 24/10/2026).</text>

  <!-- Triggers column -->
  <rect x="40" y="100" width="250" height="250" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="165" y="130" text-anchor="middle" class="h">Pull Request</text>
  <text x="165" y="152" text-anchor="middle" class="s">feature/* → develop</text>
  <text x="165" y="172" text-anchor="middle" class="s">release/* → main</text>
  <text x="165" y="206" text-anchor="middle" class="t">Regla "Protect develop"</text>
  <text x="165" y="226" text-anchor="middle" class="s">1 aprobación · hilos resueltos</text>
  <text x="165" y="246" text-anchor="middle" class="s">revisión invalidada al hacer push</text>
  <text x="165" y="266" text-anchor="middle" class="s">rama actualizada (strict)</text>
  <text x="165" y="286" text-anchor="middle" class="s">sin force push ni borrado</text>
  <text x="165" y="316" text-anchor="middle" class="t">"Protect main": además</text>
  <text x="165" y="336" text-anchor="middle" class="s">historial lineal</text>

  <rect x="40" y="380" width="250" height="110" rx="12" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="165" y="412" text-anchor="middle" class="h">Push a develop</text>
  <text x="165" y="436" text-anchor="middle" class="s">tras cada merge: mismos</text>
  <text x="165" y="456" text-anchor="middle" class="s">workflows de CI sobre el</text>
  <text x="165" y="476" text-anchor="middle" class="s">resultado integrado</text>

  <rect x="40" y="520" width="250" height="200" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="165" y="552" text-anchor="middle" class="h">Push a release/x.y.z</text>
  <text x="165" y="576" text-anchor="middle" class="s">entrega continua a Staging</text>
  <text x="165" y="626" text-anchor="middle" class="h">Push a main</text>
  <text x="165" y="650" text-anchor="middle" class="s">entrega a Production</text>
  <text x="165" y="670" text-anchor="middle" class="s">con aprobación manual</text>
  <text x="165" y="700" text-anchor="middle" class="s">(sección 3.4)</text>

  <!-- CI workflows -->
  <text x="340" y="118" class="h">Integración continua (cada Pull Request y cada push a develop)</text>

  <g>
    <rect x="340" y="132" width="390" height="104" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <rect x="340" y="132" width="390" height="26" rx="10" fill="#1565c0"/>
    <text x="352" y="150" class="k">Backend CI (C# .NET 8) · job "Build and Test"</text>
    <text x="352" y="180" class="s">restore · build Release · xUnit de los 13 servicios</text>
    <text x="352" y="200" class="s">114 ejecuciones · 96,5 % éxito · mediana 0,8 min</text>
    <rect x="600" y="210" width="120" height="20" rx="10" fill="#c62828"/><text x="660" y="224" text-anchor="middle" class="k">obligatorio</text>

    <rect x="760" y="132" width="390" height="104" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <rect x="760" y="132" width="390" height="26" rx="10" fill="#1565c0"/>
    <text x="772" y="150" class="k">SonarQube Analysis · job "Static Code Analysis"</text>
    <text x="772" y="180" class="s">SonarCloud: bugs, code smells, duplicación, cobertura</text>
    <text x="772" y="200" class="s">114 ejecuciones · 94,7 % éxito · mediana 1,7 min</text>
    <rect x="1020" y="210" width="120" height="20" rx="10" fill="#c62828"/><text x="1080" y="224" text-anchor="middle" class="k">obligatorio</text>

    <rect x="1180" y="132" width="380" height="104" rx="10" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <rect x="1180" y="132" width="380" height="26" rx="10" fill="#1565c0"/>
    <text x="1192" y="150" class="k">Frontend CI (React Vite) · job "Build and Lint"</text>
    <text x="1192" y="180" class="s">npm ci · ESLint · vite build del Dashboard</text>
    <text x="1192" y="200" class="s">114 ejecuciones · 96,5 % éxito · mediana 0,3 min</text>
    <rect x="1430" y="210" width="120" height="20" rx="10" fill="#ef6c00"/><text x="1490" y="224" text-anchor="middle" class="k">oblig. en main</text>
  </g>

  <text x="340" y="272" class="h">Validaciones por ruta (solo cuando el Pull Request toca esos archivos)</text>
  <g>
    <rect x="340" y="286" width="290" height="98" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
    <text x="352" y="310" class="t" font-weight="700">Containers CI (Docker)</text>
    <text x="352" y="332" class="s">14 imágenes: build, arranque endurecido,</text>
    <text x="352" y="350" class="s">probe de salud, Trivy, usuario no root;</text>
    <text x="352" y="368" class="s">compose y gateway sincronizados</text>

    <rect x="650" y="286" width="290" height="98" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
    <text x="662" y="310" class="t" font-weight="700">Infrastructure CI (Terraform)</text>
    <text x="662" y="332" class="s">fmt -check y validate de bootstrap,</text>
    <text x="662" y="350" class="s">staging y production</text>
    <text x="662" y="368" class="s">5 ejecuciones · 100 % éxito</text>

    <rect x="960" y="286" width="290" height="98" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
    <text x="972" y="310" class="t" font-weight="700">Deployment CI (Helm)</text>
    <text x="972" y="332" class="s">helm lint --strict (13 × 2 entornos)</text>
    <text x="972" y="350" class="s">kubeconform contra Kubernetes 1.30</text>
    <text x="972" y="368" class="s">134 recursos válidos</text>

    <rect x="1270" y="286" width="290" height="98" rx="10" fill="#ffffff" stroke="#6a1b9a" stroke-width="2"/>
    <text x="1282" y="310" class="t" font-weight="700">Feedback MongoDB Integration</text>
    <text x="1282" y="332" class="s">pruebas con MongoDB real como</text>
    <text x="1282" y="350" class="s">service container y smoke test</text>
    <text x="1282" y="368" class="s">7 ejecuciones · 100 % éxito</text>
  </g>

  <!-- Merge gate -->
  <rect x="340" y="420" width="1220" height="70" rx="12" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="950" y="450" text-anchor="middle" class="h">Puerta de merge: checks obligatorios en verde + 1 aprobación + conversaciones resueltas + rama al día con develop</text>
  <text x="950" y="474" text-anchor="middle" class="s">Si un check falla, GitHub bloquea el botón de merge; el autor corrige en la misma rama y los workflows se vuelven a ejecutar.</text>

  <!-- CD -->
  <text x="340" y="530" class="h">Entrega continua (cd-deploy.yml)</text>
  <rect x="340" y="544" width="250" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="465" y="572" text-anchor="middle" class="t" font-weight="700">Resolve release</text>
  <text x="465" y="594" text-anchor="middle" class="s">entorno y tag de imagen</text>
  <text x="465" y="614" text-anchor="middle" class="s">sha-&lt;commit&gt;</text>
  <rect x="620" y="544" width="250" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="745" y="572" text-anchor="middle" class="t" font-weight="700">Build × 13</text>
  <text x="745" y="594" text-anchor="middle" class="s">buildx · Trivy · push a GHCR</text>
  <text x="745" y="614" text-anchor="middle" class="s">solo en release/*</text>
  <rect x="900" y="544" width="300" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="1050" y="572" text-anchor="middle" class="t" font-weight="700">Deploy (environment)</text>
  <text x="1050" y="594" text-anchor="middle" class="s">OIDC → EKS · helm --atomic · smoke test</text>
  <text x="1050" y="614" text-anchor="middle" class="s">production exige aprobación</text>
  <rect x="1230" y="544" width="330" height="90" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="1395" y="572" text-anchor="middle" class="t" font-weight="700">Open release PR to main</text>
  <text x="1395" y="594" text-anchor="middle" class="s">automático tras desplegar Staging</text>
  <text x="1395" y="614" text-anchor="middle" class="s">con el tag validado</text>
  <path d="M590,589 L618,589" class="flow"/>
  <path d="M870,589 L898,589" class="flow"/>
  <path d="M1200,589 L1228,589" class="flow"/>

  <!-- arrows from triggers -->
  <path d="M290,190 L338,190" class="flow"/>
  <path d="M290,330 L338,330" class="flow"/>
  <path d="M290,435 C315,435 315,236 338,210" class="flow"/>
  <path d="M290,600 L338,600" class="flow"/>

  <!-- Practices footer -->
  <rect x="40" y="760" width="1520" height="190" rx="12" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="60" y="792" class="h">Prácticas comunes a todos los workflows</text>
  <text x="60" y="822" class="t">• concurrency: una nueva ejecución en la misma rama cancela la anterior (excepto el despliegue, que nunca se interrumpe).</text>
  <text x="60" y="848" class="t">• permissions mínimos (contents: read) y secretos solo en GitHub Secrets; AWS por OIDC, sin claves de larga duración.</text>
  <text x="60" y="874" class="t">• Versiones fijadas de herramientas: .NET 8.0.x, Node 20, Terraform 1.9.8, Helm 3.16.2, kubeconform 0.6.7, Trivy action v0.36.0.</text>
  <text x="60" y="900" class="t">• Caché de NuGet/npm y de capas Docker (type=gha) para mantener las ejecuciones por debajo de 2 minutos de mediana.</text>
  <text x="60" y="926" class="t">• Filtros paths: Terraform, Helm, contenedores y MongoDB solo corren cuando cambian sus archivos.</text>
</svg>
