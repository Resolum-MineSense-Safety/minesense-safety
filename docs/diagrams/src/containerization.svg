<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1b2631; }
      .h { font-size: 16px; font-weight: 700; fill: #1b2631; }
      .t { font-size: 13.5px; fill: #263238; }
      .s { font-size: 12.5px; fill: #455a64; }
      .m { font-size: 12.5px; fill: #263238; font-family: Consolas, monospace; }
      .lbl { font-size: 12.5px; fill: #37474f; font-style: italic; }
      .flow { stroke: #37474f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="46" class="title">Contenedorización de los microservicios de MineSense Safety</text>
  <text x="40" y="72" class="s">Una plantilla de Dockerfile multi-etapa para los 13 servicios .NET 8, una imagen nginx para el Dashboard y un entorno local completo con Docker Compose.</text>

  <!-- Multi-stage build -->
  <rect x="40" y="96" width="700" height="580" rx="14" fill="#f5f5f5" stroke="#9e9e9e"/>
  <text x="60" y="126" class="h">1. Imagen de un microservicio (build multi-etapa)</text>

  <rect x="60" y="142" width="660" height="40" rx="8" fill="#eceff1" stroke="#90a4ae"/>
  <text x="76" y="167" class="m">docker build -f src/backend/&lt;Servicio&gt;/Dockerfile src/backend</text>

  <rect x="60" y="198" width="660" height="196" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="76" y="224" class="h">Etapa build · mcr.microsoft.com/dotnet/sdk:8.0</text>
  <rect x="80" y="238" width="620" height="34" rx="6" fill="#ffffff" stroke="#90caf9"/>
  <text x="94" y="260" class="t">① COPY de los .csproj (Shared + servicio) → dotnet restore</text>
  <text x="580" y="260" class="lbl">capa en caché</text>
  <rect x="80" y="280" width="620" height="34" rx="6" fill="#ffffff" stroke="#90caf9"/>
  <text x="94" y="302" class="t">② COPY del código → dotnet publish -c Release (sin apphost)</text>
  <rect x="80" y="322" width="620" height="56" rx="6" fill="#ffffff" stroke="#90caf9"/>
  <text x="94" y="344" class="t">Si solo cambia el código, ① se reutiliza y no se vuelve a descargar NuGet.</text>
  <text x="94" y="366" class="s">.dockerignore excluye bin/, obj/, TestResults y coverage del contexto.</text>

  <path d="M390,394 L390,424" class="flow"/>
  <text x="400" y="414" class="lbl">solo /app/publish</text>

  <rect x="60" y="428" width="660" height="232" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="76" y="454" class="h">Etapa runtime · aspnet:8.0-jammy-chiseled-extra</text>
  <text x="76" y="480" class="t">• Ubuntu chiseled: sin shell, sin apt y sin utilidades del sistema.</text>
  <text x="76" y="502" class="t">• Usuario "app" (UID 1654), nunca root; puerto 8080 (ASPNETCORE_HTTP_PORTS).</text>
  <text x="76" y="524" class="t">• "extra": incluye ICU y tzdata (tildes, culturas y zonas horarias).</text>
  <text x="76" y="546" class="t">• Etiquetas OCI: origen del repositorio, título y proveedor.</text>
  <rect x="76" y="562" width="300" height="84" rx="8" fill="#ffffff" stroke="#a5d6a7"/>
  <text x="226" y="584" text-anchor="middle" class="s">Antes (aspnet:8.0, Debian 12)</text>
  <text x="226" y="608" text-anchor="middle" class="t">91 MB comprimida</text>
  <text x="226" y="630" text-anchor="middle" class="t">243 CVE (1 crítica, 58 altas)</text>
  <rect x="400" y="562" width="300" height="84" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="550" y="584" text-anchor="middle" class="s">Después (chiseled-extra, Ubuntu 22.04)</text>
  <text x="550" y="608" text-anchor="middle" class="t" font-weight="700">65 MB comprimida (−28 %)</text>
  <text x="550" y="630" text-anchor="middle" class="t" font-weight="700">6 CVE (0 críticas, 0 altas)</text>

  <!-- Compose topology -->
  <rect x="770" y="96" width="790" height="580" rx="14" fill="#fafafa" stroke="#1e88e5" stroke-width="2"/>
  <text x="790" y="126" class="h">2. Entorno local: docker compose up --build</text>

  <rect x="790" y="142" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="890" y="168" text-anchor="middle" class="t" font-weight="700">Navegador / Postman</text>
  <text x="890" y="188" text-anchor="middle" class="s">localhost:8080</text>

  <rect x="1040" y="142" width="500" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="1290" y="166" text-anchor="middle" class="t" font-weight="700">gateway · nginx-unprivileged :8080</text>
  <text x="1290" y="188" text-anchor="middle" class="s">mismas rutas /api/v1 que el ALB (generadas desde Helm) · / → Dashboard</text>
  <path d="M990,172 L1038,172" class="flow"/>

  <rect x="790" y="226" width="250" height="52" rx="8" fill="#ffffff" stroke="#8e24aa"/>
  <text x="915" y="250" text-anchor="middle" class="t">supervision-dashboard</text>
  <text x="915" y="268" text-anchor="middle" class="s">React + nginx (no root)</text>
  <path d="M1100,202 C1100,214 1060,240 1042,250" class="flow"/>

  <g class="t">
    <rect x="1070" y="226" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="249" text-anchor="middle">identity-access :5202</text>
    <rect x="1310" y="226" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1425" y="249" text-anchor="middle">operations :5203</text>
    <rect x="1070" y="270" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="293" text-anchor="middle">device-management :5204</text>
    <rect x="1310" y="270" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1425" y="293" text-anchor="middle">monitoring :5201</text>
    <rect x="1070" y="314" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="337" text-anchor="middle">fatigue-detection :5205</text>
    <rect x="1310" y="314" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1425" y="337" text-anchor="middle">alert :5206</text>
    <rect x="1070" y="358" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="381" text-anchor="middle">fleet-monitoring :5207</text>
    <rect x="1310" y="358" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1425" y="381" text-anchor="middle">incident-management :5208</text>
    <rect x="1070" y="402" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="425" text-anchor="middle">analytics :5209</text>
    <rect x="1310" y="402" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1425" y="425" text-anchor="middle">privacy-audit :5260</text>
    <rect x="1070" y="446" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="469" text-anchor="middle">reporting :5270</text>
    <rect x="1310" y="446" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1425" y="469" text-anchor="middle">edge-synchronization :5280</text>
    <rect x="1070" y="490" width="230" height="36" rx="6" fill="#ffffff" stroke="#5c6bc0"/><text x="1185" y="513" text-anchor="middle">feedback-reliability :5281</text>
  </g>
  <path d="M1290,202 L1290,224" class="flow"/>

  <text x="790" y="310" class="s">Cada servicio .NET hereda</text>
  <text x="790" y="328" class="s">el bloque x-dotnet-service:</text>
  <text x="790" y="352" class="m">read_only: true</text>
  <text x="790" y="372" class="m">tmpfs: /tmp</text>
  <text x="790" y="392" class="m">cap_drop: ALL</text>
  <text x="790" y="412" class="m">no-new-privileges</text>
  <text x="790" y="440" class="s">igual que el securityContext</text>
  <text x="790" y="458" class="s">del chart de Kubernetes.</text>

  <rect x="790" y="556" width="230" height="100" rx="8" fill="#e0f2f1" stroke="#00897b"/>
  <text x="905" y="582" text-anchor="middle" class="t" font-weight="700">postgres:16-alpine</text>
  <text x="905" y="604" text-anchor="middle" class="s">:5432 · healthcheck pg_isready</text>
  <text x="905" y="626" text-anchor="middle" class="s">contraseña desde .env</text>
  <rect x="1040" y="556" width="230" height="100" rx="8" fill="#e0f2f1" stroke="#00897b"/>
  <text x="1155" y="582" text-anchor="middle" class="t" font-weight="700">mongo:7.0</text>
  <text x="1155" y="604" text-anchor="middle" class="s">:27017 · healthcheck ping</text>
  <text x="1155" y="626" text-anchor="middle" class="s">Feedback espera "healthy"</text>
  <rect x="1290" y="556" width="250" height="100" rx="8" fill="#e0f2f1" stroke="#00897b"/>
  <text x="1415" y="582" text-anchor="middle" class="t" font-weight="700">eclipse-mosquitto:2.0</text>
  <text x="1415" y="604" text-anchor="middle" class="s">:1883 MQTT · :9001 WebSocket</text>
  <text x="1415" y="626" text-anchor="middle" class="s">broker local de los gateways Edge</text>
  <path d="M1185,526 L1185,554" class="flow"/>
  <text x="1194" y="546" class="lbl">depends_on</text>

  <!-- Bottom: lifecycle -->
  <rect x="40" y="700" width="1520" height="270" rx="14" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="60" y="730" class="h">3. La misma imagen en todo el ciclo de vida</text>
  <rect x="60" y="748" width="330" height="200" rx="10" fill="#ffffff" stroke="#8e24aa"/>
  <text x="225" y="776" text-anchor="middle" class="t" font-weight="700">Desarrollo local</text>
  <text x="225" y="802" text-anchor="middle" class="s">docker compose up --build</text>
  <text x="225" y="824" text-anchor="middle" class="s">imágenes minesense/&lt;servicio&gt;:local</text>
  <text x="225" y="846" text-anchor="middle" class="s">Swagger por servicio en :52xx</text>
  <text x="225" y="868" text-anchor="middle" class="s">API unificada en :8080/api/v1</text>
  <rect x="420" y="748" width="350" height="200" rx="10" fill="#ffffff" stroke="#8e24aa"/>
  <text x="595" y="776" text-anchor="middle" class="t" font-weight="700">Pull Request (Containers CI)</text>
  <text x="595" y="802" text-anchor="middle" class="s">build de las 14 imágenes con caché</text>
  <text x="595" y="824" text-anchor="middle" class="s">arranque endurecido + probe de salud</text>
  <text x="595" y="846" text-anchor="middle" class="s">verificación de usuario no root</text>
  <text x="595" y="868" text-anchor="middle" class="s">Trivy: sin CVE críticas/altas corregibles</text>
  <text x="595" y="890" text-anchor="middle" class="s">compose y gateway sincronizados</text>
  <rect x="800" y="748" width="350" height="200" rx="10" fill="#ffffff" stroke="#8e24aa"/>
  <text x="975" y="776" text-anchor="middle" class="t" font-weight="700">Release (cd-deploy.yml)</text>
  <text x="975" y="802" text-anchor="middle" class="s">build una sola vez por commit</text>
  <text x="975" y="824" text-anchor="middle" class="s">ghcr.io/resolum-minesense-safety/</text>
  <text x="975" y="846" text-anchor="middle" class="s">&lt;servicio&gt;:sha-&lt;commit&gt;</text>
  <text x="975" y="868" text-anchor="middle" class="s">imagen inmutable</text>
  <rect x="1180" y="748" width="360" height="200" rx="10" fill="#ffffff" stroke="#8e24aa"/>
  <text x="1360" y="776" text-anchor="middle" class="t" font-weight="700">Amazon EKS (Staging → Production)</text>
  <text x="1360" y="802" text-anchor="middle" class="s">mismo tag en ambos entornos</text>
  <text x="1360" y="824" text-anchor="middle" class="s">probes /health/live y /health/ready</text>
  <text x="1360" y="846" text-anchor="middle" class="s">FS de solo lectura · UID 1654</text>
  <text x="1360" y="868" text-anchor="middle" class="s">Pod Security "restricted"</text>
  <path d="M390,848 L418,848" class="flow"/>
  <path d="M770,848 L798,848" class="flow"/>
  <path d="M1150,848 L1178,848" class="flow"/>
</svg>
