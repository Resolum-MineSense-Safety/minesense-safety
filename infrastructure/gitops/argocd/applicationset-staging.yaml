# Staging: one Argo CD Application per microservice, generated from the list below
# (section 4.2). Each one renders the same Helm chart that deploy.sh uses, with the environment
# values, the service values and the release tag of infrastructure/gitops/environments/staging.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: minesense-staging
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [ "missingkey=error" ]
  generators:
    - list:
        elements:
          - service: identity-access-service
          - service: operations-service
          - service: device-management-service
          - service: monitoring-service
          - service: fatigue-detection-service
          - service: alert-service
          - service: fleet-monitoring-service
          - service: incident-management-service
          - service: privacy-audit-service
          - service: reporting-service
          - service: analytics-service
          - service: feedback-reliability-service
          - service: edge-synchronization-service
          - service: supervision-dashboard
  template:
    metadata:
      name: '{{.service}}-staging'
      labels:
        app.kubernetes.io/part-of: minesense-safety
        minesense/environment: staging
      annotations:
        # Rolling back: argocd app rollback <app> or revert the commit of release.yaml.
        argocd.argoproj.io/sync-wave: '{{ if eq .service "identity-access-service" }}0{{ else }}1{{ end }}'
    spec:
      project: minesense-safety
      source:
        repoURL: https://github.com/Resolum-MineSense-Safety/minesense-safety.git
        targetRevision: develop
        path: infrastructure/helm/minesense-service
        helm:
          releaseName: '{{.service}}'
          valueFiles:
            - ../values/environments/staging.yaml
            - ../values/services/{{.service}}.yaml
            - ../../gitops/environments/staging/release.yaml
            # Terraform outputs (IAM roles, SQS queue, S3 bucket, MSK brokers) per service, written by
            # infrastructure/scripts/gitops-platform-values.sh after terraform apply.
            - ../../gitops/environments/staging/platform/{{.service}}.yaml
          ignoreMissingValueFiles: true
      destination:
        server: https://kubernetes.default.svc
        namespace: staging
      syncPolicy:
        # Staging follows Git on its own: every merged release.yaml change is deployed and any
        # manual change in the cluster is reverted (self-heal).
        automated:
          prune: true
          selfHeal: true
        syncOptions: [ CreateNamespace=false, ServerSideApply=true ]
        retry:
          limit: 3
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
      # The HPA owns the replica count; Argo CD must not fight it.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers: [ /spec/replicas ]
