# Production: the single entry point (ALB Ingress: dashboard + API) and the Edge cabin simulator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minesense-gateway-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: minesense-safety
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: minesense-safety
  source:
    repoURL: https://github.com/Resolum-MineSense-Safety/minesense-safety.git
    targetRevision: main
    path: infrastructure/helm/minesense-gateway
    helm:
      releaseName: minesense-gateway
      valueFiles:
        - ../../gitops/environments/production/platform/minesense-gateway.yaml
      ignoreMissingValueFiles: true
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    syncOptions: [ ServerSideApply=true ]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-agent-production
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: minesense-safety
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: minesense-safety
  source:
    repoURL: https://github.com/Resolum-MineSense-Safety/minesense-safety.git
    targetRevision: main
    path: infrastructure/helm/minesense-edge-simulator
    helm:
      releaseName: edge-agent
      valueFiles:
        - ../../gitops/environments/production/release.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    syncOptions: [ ServerSideApply=true ]
