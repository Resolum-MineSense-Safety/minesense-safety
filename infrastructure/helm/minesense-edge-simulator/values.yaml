# The real agent runs on the gateway of each cabin (src/edge). In Staging one replica simulates a
# cabin so the whole flow can be shown: signal -> local classification -> SQLite buffer -> batch.
name: edge-agent

image:
  registry: ghcr.io/resolum-minesense-safety
  repository: edge-agent
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

# Secret with EDGE_USERNAME and EDGE_PASSWORD (deploy.sh signs the user up and creates it).
credentialsSecret: edge-agent-secrets

# Plain settings of the agent; see the table in src/edge/README.md.
env:
  EDGE_SYNC_SERVICE_URL: http://edge-synchronization-service
  IDENTITY_URL: http://identity-access-service
  EDGE_PROFILE: cycle
  EDGE_INTERVAL_SECONDS: "5"
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector:
  workload: microservices
