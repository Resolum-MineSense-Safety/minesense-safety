# Staging: same chart and same images as Production, smaller footprint (section 2.2.4).
environment: Staging

# Every service validates the access tokens of Identity & Access (ADR-007); maps merge with
# the env of each service file.
env:
  Authentication__IdentityUrl: http://identity-access-service/
  # Domain events on MSK Serverless (ADR-004), signed with the pod's IAM role. deploy.sh sets
  # Kafka__BootstrapServers from KAFKA_BOOTSTRAP_SERVERS (Terraform output kafka_bootstrap_brokers);
  # while it is empty the services only log their events and start no consumers.
  Kafka__BootstrapServers: ""
  Kafka__Authentication: AwsMskIam
  Kafka__AwsRegion: us-east-1
  # Amazon DocumentDB certificates are signed by the Amazon RDS CAs (create-k8s-secrets.sh creates the ConfigMap).
  # .NET adds this file to the system roots; the driver ignores tlsCAFile.
  SSL_CERT_FILE: /etc/minesense/ca/global-bundle.pem

trustBundle:
  configMap: documentdb-ca

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

# HPA on in Staging too (section 4.1): one replica at rest, up to three under load, so the k6
# load test (tests/performance) can show the scale-out without paying for idle replicas.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false

topologySpread:
  enabled: false
