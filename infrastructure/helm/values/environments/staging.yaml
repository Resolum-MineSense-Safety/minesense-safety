# Staging: same chart and same images as Production, smaller footprint (section 2.2.4).
environment: Staging

# Every service validates the access tokens of Identity & Access (ADR-007); maps merge with
# the env of each service file.
env:
  Authentication__IdentityUrl: http://identity-access-service/

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    memory: 384Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

topologySpread:
  enabled: false
