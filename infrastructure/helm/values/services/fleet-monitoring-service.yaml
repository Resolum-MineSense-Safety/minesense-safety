# Fleet Monitoring (EP04): control-center read model of the fleet.
name: fleet-monitoring-service
image:
  repository: fleet-monitoring-service
env:
  MongoDb__Database: minesense_fleet
  FleetMonitoring__StaleAfterMinutes: "5"
# ConnectionStrings__MongoDb (Amazon DocumentDB) comes from AWS Secrets Manager.
envFromSecrets:
  - fleet-monitoring-secrets
