# Capacity guardrails per namespace (section 4.1): a runaway HPA or a pod without limits
# cannot starve the other environment or the system pods. Sized for 15 services at the
# HPA maximum of each environment (Staging 3 replicas, Production 6).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: minesense-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.memory: 20Gi
    pods: "60"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: minesense-quota
  namespace: production
spec:
  hard:
    requests.cpu: "24"
    requests.memory: 32Gi
    limits.memory: 56Gi
    pods: "120"
    services.loadbalancers: "0"
---
# Defaults for any container that forgets to declare its resources.
apiVersion: v1
kind: LimitRange
metadata:
  name: minesense-defaults
  namespace: staging
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 256Mi }
      max: { memory: 1Gi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: minesense-defaults
  namespace: production
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { memory: 512Mi }
      max: { memory: 2Gi }
