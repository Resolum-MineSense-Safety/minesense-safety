# Monitoring of the EKS clusters (section 4.3): Prometheus, Alertmanager, Grafana,
# kube-state-metrics and node-exporter from the prometheus-community/kube-prometheus-stack chart.
# Installed in the "monitoring" namespace by infrastructure/scripts/install-observability.sh.
# Logs go to CloudWatch Logs through the amazon-cloudwatch-observability EKS add-on (Fluent Bit).

fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    retention: 7d
    # Pick up the ServiceMonitor of every microservice (label release=kube-prometheus-stack)
    # and the PrometheusRule with the SLO alerts.
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    ruleSelector:
      matchLabels:
        release: kube-prometheus-stack
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }
    nodeSelector:
      workload: microservices

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      workload: microservices
    # Mounted at /etc/alertmanager/secrets/alertmanager-webhook/
    secrets:
      - alertmanager-webhook
  # Critical alerts page the on-call engineer; warnings go to the team channel. The webhook URL
  # lives in the Secret alertmanager-webhook (create-k8s-secrets.sh), never in Git.
  config:
    route:
      receiver: team
      group_by: [ alertname, job ]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [ 'severity="critical"' ]
          receiver: oncall
          repeat_interval: 30m
    receivers:
      - name: team
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/team-url
            send_resolved: true
      - name: oncall
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-webhook/oncall-url
            send_resolved: true

grafana:
  adminUser: admin
  # The password comes from the Secret grafana-admin (create-k8s-secrets.sh).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
  nodeSelector:
    workload: microservices

kube-state-metrics:
  nodeSelector:
    workload: microservices

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
