# Section 3.7: Dependabot proposes updates of vulnerable or outdated dependencies.
# Updates are grouped and monthly so the team reviews a few pull requests instead of many;
# security updates are opened as soon as an advisory is published.
# Major version jumps are ignored (for example the .NET 8 SDK image to 11): the project targets .NET 8,
# so those updates are evaluated by hand, not proposed.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories: [ "/src/backend/*", "/src/frontend" ]
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: ci
      include: scope
