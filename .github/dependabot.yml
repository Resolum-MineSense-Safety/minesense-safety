# Section 3.7: Dependabot proposes updates of vulnerable or outdated dependencies.
# Updates are grouped and monthly so the team reviews a few pull requests instead of many;
# security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 3
    groups:
      backend:
        patterns: [ "*" ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: [ "*" ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directories: [ "/src/backend/*", "/src/frontend" ]
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: [ "*" ]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: ci
      include: scope
