name: Continuous Delivery (Amazon EKS)

# GitFlow promotion (section 1.4.6 and 3.4):
#   release/*  -> build every image once, scan it with Trivy, push it to GHCR and deploy to Staging
#   main       -> deploy the very same images to Production after the approval of the
#                 "production" GitHub environment ("build once, deploy many", section 2.2.4)
on:
  push:
    branches: [ "release/**", "main" ]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/edge/**"
      - "infrastructure/helm/**"
      - "infrastructure/k8s/**"
      - "infrastructure/scripts/**"
      - ".github/workflows/cd-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [ staging, production ]
        default: staging
      image_tag:
        description: Existing image tag to deploy (sha-<commit>); empty builds the current commit
        type: string
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/resolum-minesense-safety

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      build: ${{ steps.target.outputs.build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Decide environment and image tag
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ inputs.environment }}"
            tag="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            environment="production"
            # A release PR merged into main: deploy the images built from the release head
            # (second parent of the merge commit), never rebuild them.
            if git rev-parse -q --verify HEAD^2 >/dev/null; then
              tag="sha-$(git rev-parse HEAD^2)"
            else
              tag="sha-${{ github.sha }}"
            fi
          else
            environment="staging"
            tag=""
          fi
          if [[ -z "$tag" ]]; then
            tag="sha-${{ github.sha }}"
            build="true"
          else
            build="false"
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### Target: \`$environment\` with images \`$tag\` (build: $build)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service.name }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: identity-access-service, context: src/backend, dockerfile: src/backend/IdentityAccessService/Dockerfile }
          - { name: operations-service, context: src/backend, dockerfile: src/backend/OperationsService/Dockerfile }
          - { name: device-management-service, context: src/backend, dockerfile: src/backend/DeviceManagementService/Dockerfile }
          - { name: monitoring-service, context: src/backend, dockerfile: src/backend/MonitoringService/Dockerfile }
          - { name: fatigue-detection-service, context: src/backend, dockerfile: src/backend/FatigueDetectionService/Dockerfile }
          - { name: alert-service, context: src/backend, dockerfile: src/backend/AlertService/Dockerfile }
          - { name: fleet-monitoring-service, context: src/backend, dockerfile: src/backend/FleetMonitoringService/Dockerfile }
          - { name: incident-management-service, context: src/backend, dockerfile: src/backend/IncidentManagementService/Dockerfile }
          - { name: privacy-audit-service, context: src/backend, dockerfile: src/backend/PrivacyAuditService/Dockerfile }
          - { name: reporting-service, context: src/backend, dockerfile: src/backend/ReportingService/Dockerfile }
          - { name: analytics-service, context: src/backend, dockerfile: src/backend/AnalyticsService/Dockerfile }
          - { name: feedback-reliability-service, context: src/backend, dockerfile: src/backend/FeedbackReliabilityService/Dockerfile }
          - { name: edge-synchronization-service, context: src/backend, dockerfile: src/backend/EdgeSynchronizationService/Dockerfile }
          - { name: supervision-dashboard, context: src/frontend, dockerfile: src/frontend/Dockerfile }
          - { name: edge-agent, context: src/edge, dockerfile: src/edge/Dockerfile }
    env:
      IMAGE: ghcr.io/resolum-minesense-safety/${{ matrix.service.name }}:${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          tags: ${{ env.IMAGE }}
          # PATCH_STAMP refreshes the OS patch layer of the dashboard and the edge agent. The cloud
          # environments run Kafka, so the dashboard follows the event chain of the backend (ADR-004).
          build-args: |
            PATCH_STAMP=${{ github.run_id }}
            VITE_EVENT_DRIVEN=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.environment }}
    needs: [ resolve, build ]
    # Runs after a successful build, or directly when promoting existing images. It is automatic:
    # every push to release/** deploys to Staging and every merge to main to Production, as long as the
    # deploy role is configured (AWS_DEPLOY_ROLE_ARN). EKS_DEPLOY_ENABLED=false is an off switch.
    # With GITOPS_ENABLED=true Argo CD deploys from Git instead (gitops-promote.yml, section 4.2).
    if: >-
      always() && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.EKS_DEPLOY_ENABLED != 'false' &&
      vars.GITOPS_ENABLED != 'true' &&
      needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform (read outputs)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # The values of the environment come from its Terraform state, so they are always the ones of
      # the environment that exists now (it is recreated by infrastructure-cd.yml).
      - name: Read environment outputs
        id: tf
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
        run: |
          source infrastructure/scripts/lib/common.sh
          stack="$(stack_dir "$ENVIRONMENT")"
          terraform_init "$stack" "$(state_bucket_name)"
          for name in cluster_name vpc_id load_balancer_controller_role_arn reporting_service_role_arn                       report_requests_queue_url reports_bucket kafka_bootstrap_brokers kafka_client_role_arn; do
            echo "$name=$(tf_output "$stack" "$name")" >> "$GITHUB_OUTPUT"
          done
          [[ -n "$(tf_output "$stack" cluster_name)" ]] || { echo "::error::$ENVIRONMENT has no cluster: create it with infrastructure-cd.yml (action=apply)."; exit 1; }

      - name: Connect to the EKS cluster
        run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster_name }}" --region "${{ vars.AWS_REGION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Deploy with Helm
        id: deploy
        # bash with pipefail: otherwise "tee" hides a failed deploy.
        shell: bash
        env:
          EKS_CLUSTER_NAME: ${{ steps.tf.outputs.cluster_name }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          VPC_ID: ${{ steps.tf.outputs.vpc_id }}
          LB_CONTROLLER_ROLE_ARN: ${{ steps.tf.outputs.load_balancer_controller_role_arn }}
          REPORTING_SERVICE_ROLE_ARN: ${{ steps.tf.outputs.reporting_service_role_arn }}
          KAFKA_CLIENT_ROLE_ARN: ${{ steps.tf.outputs.kafka_client_role_arn }}
          REPORT_REQUESTS_QUEUE_URL: ${{ steps.tf.outputs.report_requests_queue_url }}
          REPORTS_BUCKET: ${{ steps.tf.outputs.reports_bucket }}
          KAFKA_BOOTSTRAP_SERVERS: ${{ steps.tf.outputs.kafka_bootstrap_brokers }}
          API_HOST: ${{ vars.API_HOST }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          bash infrastructure/scripts/deploy.sh "${{ needs.resolve.outputs.environment }}" "${{ needs.resolve.outputs.image_tag }}" | tee deploy.log
          echo "url=$(grep -oE 'https?://[^ ]+$' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

  promote:
    name: Open release PR to main
    needs: [ resolve, deploy ]
    if: needs.resolve.outputs.environment == 'staging' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --base main --json number --jq '.[0].number')"
          if [[ -z "$existing" ]]; then
            gh pr create --repo "${{ github.repository }}" --head "$BRANCH" --base main \
              --title "release: promote $BRANCH to production" \
              --body "Deployed to Staging with images \`${{ needs.resolve.outputs.image_tag }}\`. Merging this PR deploys the same images to Production after the environment approval."
          else
            echo "Release PR #$existing already open."
          fi
