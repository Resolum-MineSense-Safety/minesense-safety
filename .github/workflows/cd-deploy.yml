name: Continuous Delivery (Amazon EKS)

# GitFlow promotion (section 1.4.6 and 3.4):
#   release/*  -> build every image once, scan it with Trivy, push it to GHCR and deploy to Staging
#   main       -> deploy the very same images to Production after the approval of the
#                 "production" GitHub environment ("build once, deploy many", section 2.2.4)
on:
  push:
    branches: [ "release/**", "main" ]
    paths:
      - "src/backend/**"
      - "infrastructure/helm/**"
      - "infrastructure/k8s/**"
      - "infrastructure/scripts/**"
      - ".github/workflows/cd-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [ staging, production ]
        default: staging
      image_tag:
        description: Existing image tag to deploy (sha-<commit>); empty builds the current commit
        type: string
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/resolum-minesense-safety

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      build: ${{ steps.target.outputs.build }}
      release_tags: ${{ steps.target.outputs.release_tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide environment and image tag
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ inputs.environment }}"
            tag="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            environment="production"
            # A release PR merged into main: deploy the images built from the release head
            # (second parent of the merge commit), never rebuild them.
            if git rev-parse -q --verify HEAD^2 >/dev/null; then
              tag="sha-$(git rev-parse HEAD^2)"
            else
              tag="sha-${{ github.sha }}"
            fi
          else
            environment="staging"
            tag=""
          fi
          if [[ -z "$tag" ]]; then
            tag="sha-${{ github.sha }}"
            build="true"
          else
            build="false"
          fi
          # A release branch also publishes the SemVer tag of section 3.1.3, so the digest
          # built here is the one that main promotes later ("build once, deploy many").
          release_tags=""
          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            release_tags="v${GITHUB_REF#refs/heads/release/}"
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release_tags=$release_tags" >> "$GITHUB_OUTPUT"
          echo "### Target: \`$environment\` with images \`$tag\` (build: $build)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service.name }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: identity-access-service, project: IdentityAccessService }
          - { name: operations-service, project: OperationsService }
          - { name: device-management-service, project: DeviceManagementService }
          - { name: monitoring-service, project: MonitoringService }
          - { name: fatigue-detection-service, project: FatigueDetectionService }
          - { name: alert-service, project: AlertService }
          - { name: fleet-monitoring-service, project: FleetMonitoringService }
          - { name: incident-management-service, project: IncidentManagementService }
          - { name: privacy-audit-service, project: PrivacyAuditService }
          - { name: reporting-service, project: ReportingService }
          - { name: analytics-service, project: AnalyticsService }
          - { name: feedback-reliability-service, project: FeedbackReliabilityService }
          - { name: edge-synchronization-service, project: EdgeSynchronizationService }
    env:
      IMAGE: ghcr.io/resolum-minesense-safety/${{ matrix.service.name }}:${{ needs.resolve.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/${{ matrix.service.project }}/Dockerfile
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          RELEASE_TAGS: ${{ needs.resolve.outputs.release_tags }}
          REPOSITORY: ghcr.io/resolum-minesense-safety/${{ matrix.service.name }}
        run: |
          docker push "$IMAGE"
          for tag in $RELEASE_TAGS; do
            docker tag "$IMAGE" "$REPOSITORY:$tag"
            docker push "$REPOSITORY:$tag"
          done

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.environment }}
    needs: [ resolve, build ]
    # Runs after a successful build, or directly when promoting existing images.
    # The repository variable EKS_DEPLOY_ENABLED turns deployments on once the AWS account exists.
    if: >-
      always() && vars.EKS_DEPLOY_ENABLED == 'true' &&
      needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Connect to the EKS cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Deploy with Helm
        id: deploy
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          VPC_ID: ${{ vars.VPC_ID }}
          LB_CONTROLLER_ROLE_ARN: ${{ vars.AWS_LB_CONTROLLER_ROLE_ARN }}
          REPORTING_SERVICE_ROLE_ARN: ${{ vars.REPORTING_SERVICE_ROLE_ARN }}
          API_HOST: ${{ vars.API_HOST }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          bash infrastructure/scripts/deploy.sh "${{ needs.resolve.outputs.environment }}" "${{ needs.resolve.outputs.image_tag }}" | tee deploy.log
          echo "url=$(grep -oE 'https?://[^ ]+$' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

  promote:
    name: Open release PR to main
    needs: [ resolve, deploy ]
    if: needs.resolve.outputs.environment == 'staging' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --base main --json number --jq '.[0].number')"
          if [[ -z "$existing" ]]; then
            gh pr create --repo "${{ github.repository }}" --head "$BRANCH" --base main \
              --title "release: promote $BRANCH to production" \
              --body "Deployed to Staging with images \`${{ needs.resolve.outputs.image_tag }}\`. Merging this PR deploys the same images to Production after the environment approval."
          else
            echo "Release PR #$existing already open."
          fi
