name: Containers CI (Docker)

# Section 3.1: every pull request proves that each image builds, starts hardened, answers its
# health probe and has no fixable CRITICAL/HIGH vulnerabilities, and that the local environment
# (docker-compose + gateway) is consistent with the Kubernetes routes.
on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "docker-compose.yml"
      - "infrastructure/docker/**"
      - "infrastructure/helm/minesense-gateway/**"
      - "infrastructure/scripts/render-gateway-nginx.py"
      - ".github/workflows/containers-ci.yml"
  push:
    branches: [ "develop" ]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "docker-compose.yml"
      - "infrastructure/docker/**"
      - ".github/workflows/containers-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Compose and Gateway Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Gateway routes match the Helm gateway
        run: |
          python3 infrastructure/scripts/render-gateway-nginx.py
          git diff --exit-code -- infrastructure/docker/gateway/nginx.conf \
            || { echo "::error::Run infrastructure/scripts/render-gateway-nginx.py and commit nginx.conf"; exit 1; }

      - name: Gateway configuration is valid nginx
        run: |
          docker run --rm -v "$PWD/infrastructure/docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t

  image:
    name: Image ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: identity-access-service, context: src/backend, dockerfile: src/backend/IdentityAccessService/Dockerfile, probe: /health/ready }
          - { name: operations-service, context: src/backend, dockerfile: src/backend/OperationsService/Dockerfile, probe: /health/ready }
          - { name: device-management-service, context: src/backend, dockerfile: src/backend/DeviceManagementService/Dockerfile, probe: /health/ready }
          - { name: monitoring-service, context: src/backend, dockerfile: src/backend/MonitoringService/Dockerfile, probe: /health/ready }
          - { name: fatigue-detection-service, context: src/backend, dockerfile: src/backend/FatigueDetectionService/Dockerfile, probe: /health/ready }
          - { name: alert-service, context: src/backend, dockerfile: src/backend/AlertService/Dockerfile, probe: /health/ready }
          - { name: fleet-monitoring-service, context: src/backend, dockerfile: src/backend/FleetMonitoringService/Dockerfile, probe: /health/ready }
          - { name: incident-management-service, context: src/backend, dockerfile: src/backend/IncidentManagementService/Dockerfile, probe: /health/ready }
          - { name: privacy-audit-service, context: src/backend, dockerfile: src/backend/PrivacyAuditService/Dockerfile, probe: /health/ready }
          - { name: reporting-service, context: src/backend, dockerfile: src/backend/ReportingService/Dockerfile, probe: /health/ready }
          - { name: analytics-service, context: src/backend, dockerfile: src/backend/AnalyticsService/Dockerfile, probe: /health/ready }
          - { name: feedback-reliability-service, context: src/backend, dockerfile: src/backend/FeedbackReliabilityService/Dockerfile, probe: /health/live }
          - { name: edge-synchronization-service, context: src/backend, dockerfile: src/backend/EdgeSynchronizationService/Dockerfile, probe: /health/ready }
          - { name: supervision-dashboard, context: src/frontend, dockerfile: src/frontend/Dockerfile, probe: /healthz }
    env:
      IMAGE: minesense/${{ matrix.image.name }}:ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=ci-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image.name }}

      - name: Start hardened container and check its probe
        run: |
          # Same restrictions as the Kubernetes chart: non-root, read-only root filesystem,
          # writable /tmp only, no Linux capabilities and no privilege escalation.
          docker run -d --name under-test -p 8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e ASPNETCORE_ENVIRONMENT=Development \
            "$IMAGE"
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused \
            "http://localhost:8080${{ matrix.image.probe }}"
          user="$(docker inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Image user: ${user:-root}"
          [[ -n "$user" && "$user" != "root" && "$user" != "0" ]] || { echo "::error::The image runs as root"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs under-test || true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Report image size
        if: always()
        run: |
          size="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          echo "| ${{ matrix.image.name }} | $((size / 1024 / 1024)) MB |" >> "$GITHUB_STEP_SUMMARY"
