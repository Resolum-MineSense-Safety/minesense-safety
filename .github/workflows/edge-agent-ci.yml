name: Edge Agent CI (Python)

# EP06 (US13, US14): the cabin gateway keeps detecting and warning without connectivity and
# synchronizes its offline buffer in idempotent batches. Every change runs the pytest suite
# (unit + offline -> reconnect scenarios against a fake cloud) and proves that the image builds,
# runs hardened as non-root and has no fixable CRITICAL/HIGH vulnerabilities.
on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "src/edge/**"
      - ".github/workflows/edge-agent-ci.yml"
  push:
    branches: [ "develop" ]
    paths:
      - "src/edge/**"
      - ".github/workflows/edge-agent-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/edge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/edge/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results/pytest.xml

      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          suite = ET.parse("test-results/pytest.xml").getroot().find("testsuite")
          total, failures, errors, skipped = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print("### Edge agent tests")
          print(f"| total | passed | failed | skipped |\n|---|---|---|---|\n| {total} | {total - failures - errors - skipped} | {failures + errors} | {skipped} |")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-agent-test-results
          path: src/edge/test-results/

  image:
    name: Image edge-agent
    runs-on: ubuntu-latest
    needs: pytest
    env:
      IMAGE: minesense/edge-agent:ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: src/edge
          file: src/edge/Dockerfile
          tags: ${{ env.IMAGE }}
          load: true
          build-args: PATCH_STAMP=${{ github.run_id }}
          cache-from: type=gha,scope=ci-edge-agent
          cache-to: type=gha,mode=max,scope=ci-edge-agent

      - name: Run hardened and offline
        run: |
          # Same restrictions as the other services; the cloud is unreachable on purpose, so the
          # agent must keep detecting, warn in the cabin and keep every event in its buffer.
          docker volume create edge-ci-buffer
          docker run --name under-test --network none \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -v edge-ci-buffer:/app/data \
            -e EDGE_SYNC_SERVICE_URL=http://edge-synchronization-service:8080 \
            -e EDGE_PROFILE=microsleep -e EDGE_INTERVAL_SECONDS=0.2 -e EDGE_MAX_ITERATIONS=5 \
            -e EDGE_HTTP_TIMEOUT_SECONDS=1 -e EDGE_UNAVAILABLE_WARNING_CHANNELS=buzzer \
            "$IMAGE" 2>&1 | tee agent.log
          grep -q "\[PANTALLA\] CRITICAL" agent.log || { echo "::error::No cabin warning while offline"; exit 1; }
          grep -q "Sin comunicaci" agent.log || { echo "::error::Loss of communication not reported"; exit 1; }
          grep -q "Medio de advertencia no disponible: buzzer" agent.log || { echo "::error::Unavailable channel not reported"; exit 1; }
          grep -Eq "10 event\(s\) pending" agent.log || { echo "::error::Events were not kept in the buffer"; exit 1; }
          user="$(docker inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Image user: ${user:-root}"
          [[ -n "$user" && "$user" != "root" && "$user" != "0" && "$user" != 0:* ]] || { echo "::error::The image runs as root"; exit 1; }

      - name: Buffer survives a container restart
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -v edge-ci-buffer:/app/data \
            -e EDGE_MAX_ITERATIONS=1 -e EDGE_INTERVAL_SECONDS=0 -e EDGE_HTTP_TIMEOUT_SECONDS=1 \
            "$IMAGE" 2>&1 | tee restart.log
          grep -Eq "pending=10" restart.log || { echo "::error::Pending events lost after restart"; exit 1; }

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Report image size
        if: always()
        run: |
          size="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          echo "| edge-agent | $((size / 1024 / 1024)) MB |" >> "$GITHUB_STEP_SUMMARY"
