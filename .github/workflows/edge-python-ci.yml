name: Edge CI (Python)

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "src/edge/**"
      - ".github/workflows/edge-python-ci.yml"
  push:
    branches: [ "develop" ]
    paths:
      - "src/edge/**"
      - ".github/workflows/edge-python-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Edge agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/edge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: src/edge/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q
