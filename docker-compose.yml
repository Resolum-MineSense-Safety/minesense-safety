version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minesense_postgres
    environment:
      POSTGRES_DB: minesense_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:7.0
    container_name: minesense_mongodb
    ports:
      - "27017:27017"

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: minesense_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"

  privacy-audit-service:
    build:
      context: ./src/backend
      dockerfile: PrivacyAuditService/Dockerfile
    container_name: minesense_privacy_audit
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5260:8080"

  reporting-service:
    build:
      context: ./src/backend
      dockerfile: ReportingService/Dockerfile
    container_name: minesense_reporting
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5270:8080"