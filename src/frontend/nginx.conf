# Static server of the Supervision Dashboard (single-page application).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints the bundles, so they can be cached for a year.
    location /assets/ {
        # "expires" instead of add_header, so the security headers of the server are inherited.
        expires 1y;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Client-side routes fall back to index.html, which is never cached.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
